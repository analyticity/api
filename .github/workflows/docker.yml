name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build image
        run: docker build -t ${{ steps.meta.outputs.image }}:latest .

      - name: Tag version (if tag exists)
        if: startsWith(github.ref, 'refs/tags/')
        run: docker tag ${{ steps.meta.outputs.image }}:latest ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.image }}:latest
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          fi